// Firma de la APK de Compoint Check (se agrega a android/app/build.gradle en la compilación).
// Siempre se firma con la misma llave para que las actualizaciones se instalen encima sin desinstalar.
android {
    signingConfigs {
        capricho {
            storeFile file('../../capricho.keystore')
            storePassword System.getenv('APK_STORE_PASSWORD') ?: 'Compoint2026app'
            keyAlias 'capricho'
            keyPassword System.getenv('APK_KEY_PASSWORD') ?: 'Compoint2026app'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.capricho
            minifyEnabled false
        }
    }
}
