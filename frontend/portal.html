<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/paginas.css">
<link rel="stylesheet" href="css/finanzas.css">
<title>Portal del empleado — Capricho-compoint</title>
</head>
<body>
<div class="portal-wrap">
  <div class="portal-header">
    <div class="logo-chip"><img src="img/logo.png" alt="Compoint"></div>
    <button class="salir paso-oculto" id="btnSalir">Cerrar sesión</button>
  </div>

  <!-- Acceso -->
  <div id="vistaLogin" class="paso-oculto">
    <div class="panel">
      <div class="panel-head"><h2>Acceso al portal del empleado</h2></div>
      <form id="formLogin" class="panel-body">
        <p style="color:var(--muted);font-size:13px;margin:0 0 18px;">Consulta tus vacaciones, tus checadas y solicita permisos. Entra con tu número de empleado y el mismo PIN con el que checas.</p>
        <div class="field"><label>Número de empleado</label><input type="text" name="numero_empleado" required autocomplete="username"></div>
        <div class="field"><label>PIN</label><input type="password" name="pin" maxlength="4" inputmode="numeric" required autocomplete="current-password"></div>
        <div id="errLogin"></div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Portal -->
  <div id="vistaPortal" class="paso-oculto">
    <h1 style="font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;">Hola, <span id="nombre" style="color:var(--neon)"></span></h1>
    <p style="color:var(--muted);font-size:13px;margin:0 0 22px;" id="datos"></p>
    <div class="vacas-card">
      <div><div class="num" id="vDisp">—</div><div class="lbl">Días de vacaciones disponibles este año</div></div>
      <div style="text-align:right;font-size:12.5px;color:var(--muted);" id="vDet"></div>
    </div>

    <div id="modulos"></div>
    <div class="panel" style="margin-bottom:20px;" id="panelPago">
      <div class="panel-head"><h2>Mi pago</h2></div>
      <div id="misPagos"><div class="cargando">Cargando...</div></div>
    </div>

    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head"><h2>Nueva solicitud</h2></div>
      <form id="formSol" class="panel-body">
        <div class="form-grid">
          <div class="field"><label>Tipo</label>
            <select name="tipo" id="tipoSolicitud"><option value="vacaciones">Vacaciones</option><option value="permiso">Permiso</option><option value="incapacidad">Incapacidad</option><option value="horas_extra">Horas extra</option></select>
          </div>
          <div class="field"><label>Fecha</label><input type="date" name="fecha" required></div>
          <div class="field" id="campoFechaFin"><label>Hasta</label><input type="date" name="fecha_fin"></div>
          <div class="field" id="campoHoras"><label>Horas</label><input type="number" name="horas" step="0.5" min="0.5"></div>
          <div class="field full"><label>Comentario</label><input type="text" name="comentario" maxlength="255"></div>
          <div class="field full"><label>Justificante (opcional: PDF, JPG o PNG)</label><input type="file" id="archivo" accept="application/pdf,image/jpeg,image/png"></div>
        </div>
        <button type="submit" class="btn-primary inline">Enviar solicitud</button>
      </form>
    </div>

    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head"><h2>Mis solicitudes</h2></div>
      <div id="solicitudes" class="tabla-scroll"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Mis últimas checadas</h2></div>
      <div id="checadas" class="tabla-scroll"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const ETQ = { vacaciones: 'Vacaciones', permiso: 'Permiso', incapacidad: 'Incapacidad', horas_extra: 'Horas extra', falta: 'Falta', otro: 'Otro' };
const EST = { pendiente: 'Pendiente', aprobado: 'Aprobado', rechazado: 'Rechazado' };
const papi = (ruta, op = {}) => api(ruta, { ...op, tokenKey: 'cc_token_empleado' });

function ajustarCampos() {
  const t = document.getElementById('tipoSolicitud').value;
  document.getElementById('campoHoras').style.display = t === 'horas_extra' ? 'block' : 'none';
  document.getElementById('campoFechaFin').style.display = t !== 'horas_extra' ? 'block' : 'none';
}
document.getElementById('tipoSolicitud').onchange = ajustarCampos;

function vista(logueado) {
  document.getElementById('vistaLogin').classList.toggle('paso-oculto', logueado);
  document.getElementById('vistaPortal').classList.toggle('paso-oculto', !logueado);
  document.getElementById('btnSalir').classList.toggle('paso-oculto', !logueado);
}

async function cargar() {
  try {
    const d = await papi('/portal/yo');
    vista(true);
    const e = d.empleado;
    document.getElementById('nombre').textContent = e.nombre.split(' ')[0];
    document.getElementById('datos').textContent = [e.puesto, e.departamento, e.horario_nombre ? `Turno: ${e.horario_nombre}${e.hora_entrada ? ` (${hhmm(e.hora_entrada)}–${hhmm(e.hora_salida)})` : ''}` : null].filter(Boolean).join(' · ');
    document.getElementById('vDisp').textContent = Math.max(d.vacaciones.dias - d.dias_usados, 0);
    document.getElementById('vDet').innerHTML = `Antigüedad: <b>${d.vacaciones.anios}</b> año(s)<br>Te corresponden: <b>${d.vacaciones.dias}</b> días (LFT)<br>Usados este año: <b>${d.dias_usados}</b>`;
    document.getElementById('solicitudes').innerHTML = d.solicitudes.length ? `<table class="checadas"><thead><tr><th>Tipo</th><th>Fechas</th><th>Estado</th></tr></thead><tbody>
      ${d.solicitudes.map((s) => `<tr><td>${ETQ[s.tipo]}${s.horas ? ` · ${s.horas} h` : ''}</td><td class="hora">${fechaCorta(s.fecha)}${s.fecha_fin ? ' → ' + fechaCorta(s.fecha_fin) : ''}</td><td><span class="estado-pill estado-${s.estado}">${EST[s.estado]}</span></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty-state">Aún no has hecho solicitudes.</div>';
    document.getElementById('checadas').innerHTML = d.checadas.length ? `<table class="checadas"><thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th></tr></thead><tbody>
      ${d.checadas.map((c) => `<tr><td class="hora">${fechaCorta(c.fecha)}</td><td class="hora">${hhmmss(c.hora)}</td><td>${c.tipo === 'entrada' ? '<span class="badge badge-entrada">Entrada</span>' : '<span class="badge badge-salida">Salida</span>'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty-state">Sin checadas registradas.</div>';
    pintarModulos(e.permisos || {});
    cargarPagos();
  } catch (e) {
    localStorage.removeItem('cc_token_empleado');
    vista(false);
  }
}

document.getElementById('formLogin').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target.elements;
  document.getElementById('errLogin').innerHTML = '';
  try {
    const r = await api('/portal/login', { method: 'POST', sinRedirigir: true, tokenKey: 'nada', body: { numero_empleado: f.numero_empleado.value.trim(), pin: f.pin.value.trim() } });
    localStorage.setItem('cc_token_empleado', r.token);
    ev.target.reset();
    cargar();
  } catch (e) { document.getElementById('errLogin').innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`; }
});
document.getElementById('formSol').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target.elements;
  try {
    await papi('/portal/solicitudes', { method: 'POST', body: {
      tipo: f.tipo.value, fecha: f.fecha.value, fecha_fin: f.fecha_fin.value || null, horas: f.horas.value, comentario: f.comentario.value,
      archivo: await leerArchivo(document.getElementById('archivo'), { maxLado: 1600 })
    }});
    ev.target.reset(); ajustarCampos();
    toast('Solicitud enviada. RH o tu jefe la revisarán.');
    cargar();
  } catch (e) { toast(e.message, 'error'); }
});
function pintarModulos(p) {
  const m = [
    p.corte && ['corte.html', '💵', 'Corte del día', 'Captura la venta y los gastos de hoy'],
    (p.surtida || p.gastos || p.ver_semana) && ['semana.html', '🧾', p.ver_semana ? 'Hoja semanal' : 'Gastos y surtida', 'Compras y gastos de la semana'],
    p.nomina && ['nomina.html', '👥', 'Nómina y pagos', 'Pagos al personal'],
    p.ver_utilidad && ['mes.html', '📈', 'Resumen del mes', 'Ventas, gastos y utilidad']
  ].filter(Boolean);
  document.getElementById('modulos').innerHTML = m.length ? `<div class="lbl" style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;">Mis módulos</div>
    <div class="dos" style="margin-bottom:20px;">${m.map(([href, ico, t, d]) => `<a href="${href}" class="tarjeta" style="display:block;margin:0;border-color:rgba(93,247,106,.35);">
      <div style="font-size:22px;">${ico}</div><div style="font-weight:700;margin-top:4px;">${t}</div><div style="font-size:12px;color:var(--muted);">${d}</div></a>`).join('')}</div>` : '';
}
async function cargarPagos() {
  try {
    const d = await papi('/portal/pagos');
    const a = d.semana_actual;
    let h = '';
    if (a) {
      h += `<div class="panel-body" style="border-bottom:1px solid var(--line);">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Semana en curso (${rangoSemana(a.lunes, sumarDiasStr(a.lunes, 6))}) · se actualiza con tus checadas</div>
        <div class="dias" style="margin-bottom:10px;">${a.detalle.map((x) => `<i class="${x.estado}" title="${x.estado}">${x.codigo}</i>`).join('')}</div>
        <div class="calc"><span class="muted">${a.dias_trabajados} días × ${$m(a.sueldo_diario)}</span><span class="money">${$m(a.sueldo)}</span></div>
        <div class="calc"><span class="muted">Puntualidad (${a.dias_puntuales} días a tiempo)</span><span class="money pos">+${$m(a.bono_puntualidad)}</span></div>
        ${a.extras.map((b) => `<div class="calc"><span class="muted">${esc(b.concepto)}</span><span class="money" style="color:${b.monto < 0 ? 'var(--red)' : '#4ea8f7'}">${b.monto > 0 ? '+' : ''}${$m(b.monto)}</span></div>`).join('')}
        <div class="calc"><span style="font-weight:700;">${a.pago ? 'Pagado' : 'Llevas ganado'}</span><span class="money pos" style="font-weight:700;font-size:18px;">${$m(a.pago ? a.pago.total : a.total)}</span></div>
      </div>`;
    }
    h += d.pagos.length ? d.pagos.map((p) => `<div class="alerta-fila"><div><div class="alerta-nombre">Semana ${rangoSemana(p.semana, sumarDiasStr(p.semana, 6))}</div>
        <div class="alerta-detalle">${p.dias_trabajados} días · puntualidad ${$m(p.bono_puntualidad)}${Number(p.bonos_extra) ? ' · extras ' + $m(p.bonos_extra) : ''} · ${p.metodo} · ${fechaHora(p.pagado_en)}</div></div>
        <div style="text-align:right;"><div class="money pos" style="font-weight:700;">${$m(p.total)}</div>
        ${p.recibido_en ? '<span class="pagado">✍️ Recibido</span>' : `<button class="btn-pagar" onclick="confirmarRecibido(${p.id}, ${p.total})">Recibí mi pago</button>`}</div></div>`).join('')
      : '<div class="empty-state" style="padding:22px;">Aún no tienes pagos registrados.</div>';
    document.getElementById('misPagos').innerHTML = h;
  } catch (e) { document.getElementById('misPagos').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`; }
}
async function confirmarRecibido(id, total) {
  const pin = await preguntar('Recibí mi pago', `Confirma con tu PIN que recibiste <b style="color:var(--neon)">${$m(total, 2)}</b>. Queda como tu firma de recibido.`,
    { boton: 'Confirmar', campo: { label: 'Tu PIN', html: '<input name="valor" type="password" inputmode="numeric" maxlength="4" class="select-input">' } });
  if (!pin) return;
  try { await papi(`/portal/pagos/${id}/recibido`, { method: 'POST', body: { pin } }); toast('Pago confirmado ✓'); cargarPagos(); }
  catch (e) { toast(e.message, 'error'); }
}
document.getElementById('btnSalir').onclick = () => { localStorage.removeItem('cc_token_empleado'); vista(false); };
ajustarCampos();
if (localStorage.getItem('cc_token_empleado')) cargar(); else vista(false);
</script>
</body>
</html>
