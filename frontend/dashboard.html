<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/paginas.css">
<title>Dashboard — Capricho-compoint</title>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="fecha" id="fecha"></div>
    </div>
    <div id="avisoFestivo"></div>
    <div id="avisoRevisar"></div>
    <div id="finHoy"></div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="label">Empleados activos</div><div class="value" id="kTotal">—</div></div>
      <div class="kpi-card accent-forest"><div class="label">Presentes hoy</div><div class="value" id="kPresentes">—</div></div>
      <div class="kpi-card accent-amber"><div class="label">Retardos hoy</div><div class="value" id="kRetardos">—</div></div>
      <div class="kpi-card accent-red"><div class="label">Faltan por llegar</div><div class="value" id="kAusentes">—</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Checadas de hoy</h2><span style="font-size:11.5px;color:var(--muted-2);">Se actualiza cada 30 s</span></div>
      <div id="tabla" class="tabla-scroll"><div class="cargando">Cargando...</div></div>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/verificador.js"></script>
<script>
iniciarPanel();
async function cargar() {
  try {
    const d = await api('/dashboard');
    document.getElementById('fecha').textContent = fechaLarga(d.fecha);
    document.getElementById('kTotal').textContent = d.total_empleados;
    document.getElementById('kPresentes').textContent = d.presentes;
    document.getElementById('kRetardos').textContent = d.retardos;
    document.getElementById('kAusentes').textContent = d.ausentes;
    document.getElementById('avisoFestivo').innerHTML = d.festivo ? `<div class="disclaimer">Hoy es día festivo: ${esc(d.festivo)}. No se esperan checadas.</div>` : '';
    const t = document.getElementById('tabla');
    if (!d.checadas.length) {
      t.innerHTML = `<div class="empty-state">Todavía no hay checadas registradas hoy.<br>Abre la <a href="pantalla-qr.html" style="color:var(--neon)">Pantalla QR</a> en la entrada para que el personal empiece a checar.</div>`;
      return;
    }
    t.innerHTML = `<table class="checadas"><thead><tr><th>Hora</th><th>Empleado</th><th>Puesto</th><th>Tipo</th><th>Método</th></tr></thead><tbody>
      ${d.checadas.map((c) => `<tr>
        <td class="hora">${hhmmss(c.hora)}</td>
        <td>${esc(c.nombre)}</td>
        <td>${esc(c.puesto || '—')}</td>
        <td>${c.tipo === 'entrada' ? '<span class="badge badge-entrada">Entrada</span>' : '<span class="badge badge-salida">Salida</span>'}</td>
        <td style="text-transform:capitalize;font-size:12.5px;" class="${c.metodo === 'manual' ? 'metodo-manual' : ''}">${esc(c.metodo)}${insigniaRostro(c)}</td>
      </tr>`).join('')}</tbody></table>`;
  } catch (e) { toast(e.message, 'error'); }
}
cargar();
setInterval(cargar, 30000);
// Checadas cuya selfie no coincidió con el expediente (las compara este mismo panel en segundo plano)
async function avisoRevisar() {
  try {
    const n = await api('/revision/conteo');
    document.getElementById('avisoRevisar').innerHTML = n.revisar ? `<a href="checadas.html#revisar" class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;margin-bottom:16px;border-color:rgba(247,198,93,.55);background:var(--amber-bg);">
      <span><b style="color:var(--amber);">⚠ ${n.revisar} checada${n.revisar === 1 ? '' : 's'} por revisar</b> <span style="font-size:13px;color:var(--muted);">· la foto no coincidió con el expediente</span></span>
      <span class="btn-mini" style="white-space:nowrap;">Revisar →</span></a>` : '';
  } catch (_) {}
}
// Resumen de finanzas de hoy (solo administrador)
if (esAdmin()) {
  iniciarVerificador();
  avisoRevisar();
  setInterval(avisoRevisar, 30000);
  document.addEventListener('revision-actualizada', () => { avisoRevisar(); cargar(); });
  api('/finanzas/corte').then((d) => {
    const r = d.resumen, c = d.corte;
    document.getElementById('finHoy').innerHTML = `<a href="corte.html" class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;margin-bottom:20px;flex-wrap:wrap;">
      <div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);">Corte del día · ${fechaCorta(d.fecha)}</div>
      <div style="font-size:13px;margin-top:3px;">${c ? (c.estado === 'cerrado' ? '<span class="estado-pill estado-activo">Cerrado</span>' : '<span class="estado-pill estado-pendiente">Abierto</span>') + ' · capturó ' + esc(c.capturado_por || '') : '<span style="color:var(--amber)">Todavía no se captura</span>'}</div></div>
      <div style="display:flex;gap:26px;font-family:var(--font-mono);"><div><div style="font-size:11px;color:var(--muted);font-family:var(--font-body);">Venta</div>${$m(r.venta_total)}</div>
      <div><div style="font-size:11px;color:var(--muted);font-family:var(--font-body);">Efectivo final</div><span style="color:var(--neon)">${$m(r.efectivo_final)}</span></div>
      ${r.diferencia !== null ? `<div><div style="font-size:11px;color:var(--muted);font-family:var(--font-body);">Caja</div><span style="color:${r.diferencia < 0 ? 'var(--red)' : 'var(--neon)'}">${r.diferencia === 0 ? '✓' : (r.diferencia > 0 ? '+' : '') + $m(r.diferencia)}</span></div>` : ''}</div></a>`;
  }).catch(() => {});
}
</script>
</body>
</html>
