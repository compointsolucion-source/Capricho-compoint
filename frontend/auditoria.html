<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/paginas.css">
<title>Auditoría — Capricho-compoint</title>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="topbar"><h1>Auditoría</h1></div>
    <p style="color:var(--muted);font-size:13px;margin-top:-14px;margin-bottom:20px;">Registro de todas las checadas creadas, editadas o eliminadas manualmente desde el panel (últimos 200 movimientos).</p>
    <div class="panel" style="margin-bottom:20px;"><div class="panel-head"><h2>Checadas</h2></div><div id="tabla" class="tabla-scroll"><div class="cargando">Cargando...</div></div></div>
    <div class="panel"><div class="panel-head"><h2>Finanzas: cortes, gastos, nómina y permisos</h2></div><div id="tablaFin" class="tabla-scroll"><div class="cargando">Cargando...</div></div></div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
iniciarPanel({ soloAdmin: true });
const ETQ = { creada: 'Creada', editada: 'Editada', eliminada: 'Eliminada', aprobada: 'Rostro confirmado' };
api('/checadas/auditoria').then((rs) => {
  const t = document.getElementById('tabla');
  if (!rs.length) { t.innerHTML = '<div class="empty-state">Todavía no hay cambios manuales registrados. Esto es buena señal.</div>'; return; }
  t.innerHTML = `<table class="checadas"><thead><tr><th>Fecha/hora</th><th>Empleado</th><th>Acción</th><th>Antes</th><th>Después</th><th>Realizado por</th></tr></thead><tbody>
    ${rs.map((r) => `<tr>
      <td class="hora">${fechaHora(r.creado_en)}</td>
      <td>${esc(r.empleado_nombre)}</td>
      <td><span class="accion-pill accion-${r.accion}">${ETQ[r.accion]}</span></td>
      <td class="hora">${esc(r.valor_anterior || '—')}</td>
      <td class="hora">${esc(r.valor_nuevo || '—')}</td>
      <td>${esc(r.admin_nombre || '(usuario eliminado)')}</td>
    </tr>`).join('')}</tbody></table>`;
}).catch((e) => toast(e.message, 'error'));
const ACC = { corregido: 'Corregido', reabierto: 'Reabierto', eliminado: 'Eliminado', bono_eliminado: 'Bono quitado', pago_deshecho: 'Pago deshecho', cambiados: 'Cambiados' };
api('/finanzas/auditoria').then((rs) => {
  const t = document.getElementById('tablaFin');
  if (!rs.length) { t.innerHTML = '<div class="empty-state">Sin cambios registrados en finanzas.</div>'; return; }
  const resumen = (o) => o ? esc(Object.entries(o).filter(([k]) => ['venta_total', 'venta_tarjeta', 'efectivo_contado', 'monto', 'total', 'concepto', 'corte', 'surtida', 'gastos', 'nomina', 'ver_semana', 'ver_utilidad', 'corregir'].includes(k))
    .map(([k, v]) => `${k.replace('_', ' ')}: ${v === true ? 'sí' : v === false ? 'no' : v ?? '—'}`).join(' · ')) : '—';
  t.innerHTML = `<table class="checadas"><thead><tr><th>Fecha/hora</th><th>Módulo</th><th>Acción</th><th>Detalle</th><th>Antes</th><th>Después</th><th>Usuario</th></tr></thead><tbody>
    ${rs.map((r) => `<tr><td class="hora">${fechaHora(r.creado_en)}</td><td style="text-transform:capitalize;">${esc(r.modulo)}</td>
      <td><span class="accion-pill accion-${r.accion === 'cambiados' || r.accion === 'reabierto' ? 'editada' : r.accion === 'corregido' ? 'editada' : 'eliminada'}">${ACC[r.accion] || esc(r.accion)}</span></td>
      <td style="font-size:12.5px;">${esc(r.descripcion || '')}</td><td style="font-size:11.5px;color:var(--muted);">${resumen(r.antes)}</td><td style="font-size:11.5px;color:var(--muted);">${resumen(r.despues)}</td><td>${esc(r.usuario || '')}</td></tr>`).join('')}</tbody></table>`;
}).catch((e) => { document.getElementById('tablaFin').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`; });
</script>
</body>
</html>
