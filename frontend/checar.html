<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/paginas.css">
<link rel="stylesheet" href="css/finanzas.css">
<style>
  .bono-card { margin-top: 12px; border-radius: 12px; padding: 14px; background: linear-gradient(135deg, rgba(247,198,93,.16), rgba(247,198,93,.04)); border: 1px solid rgba(247,198,93,.5); text-align:center; }
  .bono-card .big { font-family: var(--font-mono); font-size: 28px; font-weight:600; color: var(--amber); }
  .bono-card .t { font-size: 11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color: var(--amber); }
  .bono-card .d { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .racha { display:flex; gap:6px; margin-top: 10px; justify-content:center; flex-wrap: wrap; }
  .racha span { min-width: 38px; height: 30px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size: 10.5px; font-weight:700; background: var(--bg-panel-2); color: var(--muted-2); border: 1px solid var(--line); }
  .racha .a_tiempo { background: var(--neon-bg); color: var(--neon); border-color: rgba(93,247,106,.4); }
  .racha .retardo { background: var(--amber-bg); color: var(--amber); border-color: rgba(247,198,93,.4); }
  .racha .falta { background: var(--red-bg); color: var(--red); border-color: rgba(247,106,106,.4); }
  .celular-nuevo { margin-top: 12px; border-radius: 12px; padding: 12px; background: var(--neon-bg); border: 1px solid rgba(93,247,106,.4); font-size: 13px; text-align:center; }
  .btn-foto { margin-top: 4px; }
  .camara-box.flash::after { content:''; position:absolute; inset:0; background:#fff; animation: flash .35s ease-out forwards; }
  @keyframes flash { from { opacity:.9; } to { opacity:0; } }
  .res-tarde { background: var(--amber-bg); border: 1px solid rgba(247,198,93,.4); color: var(--amber); border-radius: 12px; padding: 12px; text-align:center; font-size: 13.5px; margin-top: 12px; }
</style>
<title>Registrar checada — Capricho-compoint</title>
</head>
<body>
<div class="checar-wrap">
  <div class="checar-card">
    <div class="logo-chip"><img src="img/logo.png" alt="Compoint"></div>

    <div id="pasoCargando"><p class="sub">Verificando código...</p></div>

    <div id="pasoExpirado" class="paso-oculto">
      <h2>Código expirado</h2>
      <p class="sub">Este QR ya venció. Escanea el que está en pantalla ahora mismo.</p>
      <div class="acciones-reintento"></div>
    </div>

    <div id="pasoPin" class="paso-oculto">
      <h2>Ingresa tu PIN</h2>
      <p class="sub">4 dígitos que te asignó RH</p>
      <input type="tel" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="pin-input" id="pin" placeholder="••••" autocomplete="off">
      <button type="button" class="btn-primary" id="btnValidarPin">Continuar</button>
      <div id="resultadoPin" style="margin-top:18px;"></div>
    </div>

    <div id="pasoFacial" class="paso-oculto">
      <h2>Foto de tu checada</h2>
      <p class="sub" id="nombreEmpleado"></p>
      <div class="camara-box" id="camaraBox"><video id="video" autoplay muted playsinline></video></div>
      <div class="estado-facial" id="estadoFacial">Abriendo cámara...</div>
      <button type="button" class="btn-primary btn-foto paso-oculto" id="btnFoto">📸 Tomar foto</button>
    </div>

    <div id="pasoResultado" class="paso-oculto"></div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const pinInput = document.getElementById('pin');
const btn = document.getElementById('btnValidarPin');
const resultadoPin = document.getElementById('resultadoPin');
let empleadoActual = null;
let stream = null;
let detector = null;  // promesa: detector de rostro ligero (≈850 KB la primera vez, luego queda guardado)
let sesion = null;    // la da el servidor al validar el PIN (4 minutos para terminar)
let enviando = false;

// Código propio de este celular (se registra a nombre del empleado la primera vez)
function codigoCelular() {
  let c = null;
  try { c = localStorage.getItem('capricho_celular'); } catch (_) {}
  if (!c || !/^[a-f0-9]{64}$/.test(c)) {
    const a = new Uint8Array(32);
    crypto.getRandomValues(a);
    c = Array.from(a, (x) => x.toString(16).padStart(2, '0')).join('');
    try { localStorage.setItem('capricho_celular', c); } catch (_) {}
  }
  return c;
}
const celular = codigoCelular();

// Botones para volver a escanear: dentro de la app abre el escáner;
// en el navegador también se puede escanear desde aquí con la cámara.
function botonesReintento() {
  return `<a href="escanear.html" class="btn-primary" style="display:block;text-align:center;margin-top:16px;">📷 Escanear el QR de nuevo</a>
    ${esAppAndroid() ? '<a href="app.html" class="btn-secondary" style="display:flex;justify-content:center;margin-top:10px;">Volver al inicio</a>'
      : '<p class="sub" style="margin-top:12px;">O vuelve a apuntar la cámara de tu celular al QR de la pantalla.</p>'}`;
}
document.querySelectorAll('.acciones-reintento').forEach((d) => { d.innerHTML = botonesReintento(); });

function mostrar(id) {
  ['pasoCargando', 'pasoExpirado', 'pasoPin', 'pasoFacial', 'pasoResultado'].forEach((p) =>
    document.getElementById(p).classList.toggle('paso-oculto', p !== id));
}

async function post(ruta, body) {
  const r = await fetch(API_URL + ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let d = {};
  try { d = await r.json(); } catch (_) {}
  if (!r.ok && !d.error) d = { ok: false, error: 'Error del servidor. Intenta de nuevo.' };
  return d;
}

function cargarScript(src) {
  return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
}
// Solo el detector ligero: sirve para tomar la foto en cuanto se ve un rostro.
// La comparación con el expediente se hace después en el panel, sin hacerte esperar.
function cargarDetector() {
  if (!detector) {
    detector = (async () => {
      if (!window.faceapi) await cargarScript('js/vendor/face-api.min.js');
      await faceapi.nets.tinyFaceDetector.loadFromUri('modelos');
    })();
    detector.catch(() => { detector = null; });
  }
  return detector;
}

(async function inicio() {
  try {
    const r = await fetch(`${API_URL}/qr/valido/${encodeURIComponent(token)}`).then((x) => x.json());
    if (!r.valido) return mostrar('pasoExpirado');
    if (r.requiere_facial) {
      cargarDetector(); // se descarga mientras escribes tu PIN
      document.querySelector('#pasoPin .sub').textContent = '4 dígitos que te asignó RH · después se tomará una foto rápida de tu rostro';
    }
    mostrar('pasoPin');
    pinInput.focus();
  } catch (_) {
    document.getElementById('pasoCargando').innerHTML = '<div class="resultado error">Sin conexión con el servidor. Revisa tu internet y vuelve a escanear.</div>' + botonesReintento();
  }
})();

pinInput.addEventListener('input', () => {
  pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
  if (pinInput.value.length === 4 && !btn.disabled) btn.click(); // al 4º dígito sigue solo
});
pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });

btn.addEventListener('click', async () => {
  const pin = pinInput.value;
  if (pin.length !== 4) { resultadoPin.innerHTML = '<div class="resultado error">Ingresa los 4 dígitos de tu PIN.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Verificando...';
  resultadoPin.innerHTML = '';
  try {
    const data = await post('/qr/pin', { token, pin, dispositivo: celular });
    if (!data.ok) {
      if (data.expirado) { mostrar('pasoExpirado'); return; }
      resultadoPin.innerHTML = `<div class="resultado error">${esc(data.error)}</div>`;
      btn.disabled = false; btn.textContent = 'Continuar';
      pinInput.value = ''; pinInput.focus();
      return;
    }
    empleadoActual = data;
    sesion = data.sesion || null;
    if (data.requiere_facial) {
      mostrar('pasoFacial');
      document.getElementById('nombreEmpleado').textContent = data.nombre;
      tomarSelfie();
    } else {
      registrarChecada(null);
    }
  } catch (e) {
    resultadoPin.innerHTML = '<div class="resultado error">Error de conexión. Intenta de nuevo.</div>';
    btn.disabled = false; btn.textContent = 'Continuar';
  }
});

async function registrarChecada(foto) {
  if (enviando) return;
  enviando = true;
  try {
    const data = await post('/qr/checar', { token, sesion, pin: pinInput.value, foto, dispositivo: celular });
    mostrarResultadoFinal(data);
  } catch (e) {
    mostrarResultadoFinal({ ok: false, error: 'Error de conexión al registrar la checada.' });
  }
  enviando = false;
}

function apagarCamara() {
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
}

function mostrarResultadoFinal(data) {
  apagarCamara();
  mostrar('pasoResultado');
  const c = document.getElementById('pasoResultado');
  if (data.ok) {
    if (navigator.vibrate) navigator.vibrate(120);
    const titulo = data.tipo === 'entrada' ? 'Entrada registrada' : 'Salida registrada';
    const saludo = data.tipo === 'entrada' ? '¡Buen día!' : '¡Hasta luego!';
    const p = data.puntualidad;
    let extra = '';
    if (p && p.evaluable) {
      const CORTO = { L: 'LUN', M: 'MAR', X: 'MIÉ', J: 'JUE', V: 'VIE', S: 'SÁB', D: 'DOM' };
      const racha = (p.racha || []).length ? `<div class="racha">${p.racha.map((r) => `<span class="${r.estado}">${CORTO[r.codigo]}</span>`).join('')}</div>` : '';
      extra = p.a_tiempo
        ? `<div class="bono-card"><div class="t">¡Llegaste a tiempo! · Bono de puntualidad</div><div class="big">+$${Number(p.bono_hoy || 0).toLocaleString('es-MX')}</div>
            <div class="d">Llevas <b style="color:var(--white)">$${Number(p.bono_semana || 0).toLocaleString('es-MX')}</b> de bono esta semana</div>${racha}</div>`
        : `<div class="res-tarde">Llegaste <b>${p.min_tarde} min tarde</b> (tu entrada es a las ${String(p.hora_entrada).slice(0, 5)}). Hoy no aplica el bono de puntualidad.${racha}</div>`;
    }
    const nuevo = empleadoActual && empleadoActual.celular_nuevo
      ? '<div class="celular-nuevo">📱 Este celular quedó registrado como tuyo. Desde ahora checa siempre con él.</div>' : '';
    c.innerHTML = `<div class="resultado ok">${titulo}${data.foto_guardada ? ' · foto guardada ✓' : ''}<br><strong style="font-size:18px;">${esc(data.empleado)}</strong><div class="hora">${esc(data.hora)}</div></div>
      ${extra}${nuevo}
      <p class="sub" style="margin-top:18px;">${saludo} ${esAppAndroid() ? '' : 'Ya puedes cerrar esta página.'}</p>
      ${esAppAndroid() ? '<a href="app.html" class="btn-primary" style="display:block;text-align:center;">Listo</a>' : ''}`;
  } else {
    c.innerHTML = `<div class="resultado error">${esc(data.error)}</div>
      ${botonesReintento()}`;
  }
}

function errorCamara(mensaje) {
  apagarCamara();
  mostrar('pasoResultado');
  document.getElementById('pasoResultado').innerHTML = `<div class="resultado error">${esc(mensaje)}</div>
    <p class="sub" style="margin-top:16px;">La checada <b>no</b> se registró.</p>
    <button class="btn-primary" id="btnReintentar">Intentar de nuevo</button>${botonesReintento()}`;
  document.getElementById('btnReintentar').onclick = () => { mostrar('pasoFacial'); tomarSelfie(); };
}

// ---------- Selfie rápida: se toma sola en cuanto se ve tu rostro ----------
async function tomarSelfie() {
  const estado = document.getElementById('estadoFacial');
  const caja = document.getElementById('camaraBox');
  const video = document.getElementById('video');
  const btnFoto = document.getElementById('btnFoto');
  let tomada = false;
  caja.classList.remove('ok', 'flash');
  btnFoto.classList.add('paso-oculto');

  estado.textContent = 'Abriendo cámara...';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream;
    await new Promise((r) => { if (video.readyState >= 1) r(); else video.onloadedmetadata = r; });
    await video.play().catch(() => {});
  } catch (e) {
    return errorCamara('No se pudo abrir la cámara. Dale permiso a la cámara (en la app: Ajustes → Apps → Capricho → Permisos; en el navegador: el ícono del candado junto a la dirección).');
  }

  const capturar = () => {
    if (tomada || !stream) return;
    tomada = true;
    const canvas = document.createElement('canvas');
    const escala = Math.min(1, 480 / (video.videoWidth || 480));
    canvas.width = Math.round((video.videoWidth || 480) * escala); canvas.height = Math.round((video.videoHeight || 360) * escala);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const foto = canvas.toDataURL('image/jpeg', 0.8);
    caja.classList.add('ok', 'flash');
    btnFoto.classList.add('paso-oculto');
    estado.textContent = 'Registrando tu checada...';
    if (navigator.vibrate) navigator.vibrate(40);
    registrarChecada(foto);
  };
  btnFoto.onclick = capturar;
  estado.textContent = 'Mira a la cámara...';
  // Si en 2.5 s no se tomó sola (poca luz, detector sin descargar), aparece el botón
  setTimeout(() => { if (!tomada) { btnFoto.classList.remove('paso-oculto'); estado.textContent = 'Mira a la cámara y toca "Tomar foto"'; } }, 2500);

  // Esperar unos milisegundos a que la cámara ajuste la luz
  await new Promise((r) => setTimeout(r, 350));
  try { await Promise.race([cargarDetector(), new Promise((_, mal) => setTimeout(mal, 6000))]); } catch (_) { return; } // sin detector: queda el botón
  const opciones = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 });
  let vistos = 0;
  while (!tomada && stream) {
    try {
      const det = await faceapi.detectSingleFace(video, opciones);
      // Dos cuadros seguidos con rostro de buen tamaño = foto nítida y de frente
      vistos = det && det.box.width > video.videoWidth * 0.18 ? vistos + 1 : 0;
      if (vistos >= 2) { capturar(); break; }
    } catch (_) { break; }
    await new Promise((r) => setTimeout(r, 120));
  }
}
</script>
</body>
</html>
